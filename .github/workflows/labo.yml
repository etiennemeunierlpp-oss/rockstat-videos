name: Labo voix + SFX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["atelier/labo/**", ".github/workflows/labo.yml"]
permissions:
  contents: write
jobs:
  labo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Labo
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          python3 atelier/labo/labo.py
          git config --global user.name "rockstat-bot"; git config --global user.email "bot@rockstat433"
          cd labo_out && git init -q && git checkout -q -b labo && git add -A && git commit -qm "labo $(date +%F_%H%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" labo
